<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .badge { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .d0t { font-size: 16px; font-weight: 700; fill: #3730a3; }
      .d0s { font-size: 12px; fill: #6366f1; }
      .d0i { font-size: 13px; fill: #334155; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: .5px; }
      .ct { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .cd { font-size: 12px; fill: #475569; }
      .cs { font-size: 11.5px; fill: #64748b; }
      .foott { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .foot { font-size: 13px; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="1240" height="720" fill="#ffffff"/>

  <text x="620" y="44" text-anchor="middle" class="title" fill="url(#tg)">Part 4: build the nervous system, one layer at a time</text>
  <text x="620" y="72" text-anchor="middle" class="subtitle">Start with the agent (the mind). Add one layer per prompt until it wakes itself, survives crashes, and gates on a human.</text>

  <!-- D0 the agent -->
  <g filter="url(#sh)"><rect x="40" y="118" width="300" height="442" rx="14" fill="#eef2ff" stroke="#c7d2fe"/></g>
  <circle cx="74" cy="152" r="16" fill="#4f46e5"/><text x="74" y="157" text-anchor="middle" class="badge">D0</text>
  <text x="100" y="150" class="d0t">THE AGENT</text>
  <text x="100" y="170" class="d0s">thinks and acts, built once</text>
  <line x1="60" y1="192" x2="320" y2="192" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="62" y="232" class="d0i">&#8226;  OpenAI Agents SDK</text>
  <text x="62" y="268" class="d0i">&#8226;  two tools (reply, refund)</text>
  <text x="62" y="304" class="d0i">&#8226;  Neon Postgres</text>
  <text x="62" y="340" class="d0i">&#8226;  audit trail</text>
  <line x1="60" y1="372" x2="320" y2="372" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="62" y="404" class="cd">It never changes after D0.</text>
  <text x="62" y="426" class="cd">Every layer to the right is</text>
  <text x="62" y="446" class="cd">the nervous system, added</text>
  <text x="62" y="466" class="cd">from the outside.</text>

  <line x1="344" y1="338" x2="376" y2="216" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- row 1: D1 D2 D3 -->
  <!-- D1 Reflex -->
  <g filter="url(#sh)"><rect x="380" y="118" width="266" height="206" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="380" y="118" width="6" height="206" rx="3" fill="#d97706"/>
  <rect x="398" y="138" width="120" height="24" rx="12" fill="#fef3c7"/><text x="412" y="154" class="tag" fill="#b45309">D1 &#183; REFLEX</text>
  <text x="400" y="196" class="ct">Make it durable</text>
  <text x="400" y="222" class="cd">Wrap the whole agent run</text>
  <text x="400" y="240" class="cd">in one step.run.</text>
  <line x1="400" y1="262" x2="626" y2="262" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="400" y="290" class="cs">you see: the agent step memoized</text>

  <!-- D2 Sense -->
  <g filter="url(#sh)"><rect x="666" y="118" width="266" height="206" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="666" y="118" width="6" height="206" rx="3" fill="#16a34a"/>
  <rect x="684" y="138" width="116" height="24" rx="12" fill="#dcfce7"/><text x="698" y="154" class="tag" fill="#15803d">D2 &#183; SENSE</text>
  <text x="686" y="196" class="ct">Wake it on an event</text>
  <text x="686" y="222" class="cd">A customer/email.received</text>
  <text x="686" y="240" class="cd">event drives the run.</text>
  <line x1="686" y1="262" x2="912" y2="262" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="686" y="290" class="cs">you see: a run with audit rows</text>

  <!-- D3 Sense -->
  <g filter="url(#sh)"><rect x="952" y="118" width="248" height="206" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="952" y="118" width="6" height="206" rx="3" fill="#16a34a"/>
  <rect x="970" y="138" width="116" height="24" rx="12" fill="#dcfce7"/><text x="984" y="154" class="tag" fill="#15803d">D3 &#183; SENSE</text>
  <text x="972" y="196" class="ct">Daily cron, fan out</text>
  <text x="972" y="222" class="cd">One health-check event</text>
  <text x="972" y="240" class="cd">per eligible customer.</text>
  <line x1="972" y1="262" x2="1180" y2="262" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="972" y="290" class="cs">you see: one child run each</text>

  <!-- row 2: D4 D5 D6 -->
  <!-- D4 Balance -->
  <g filter="url(#sh)"><rect x="380" y="340" width="266" height="206" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="380" y="340" width="6" height="206" rx="3" fill="#e11d48"/>
  <rect x="398" y="360" width="132" height="24" rx="12" fill="#ffe4e6"/><text x="412" y="376" class="tag" fill="#be123c">D4 &#183; BALANCE</text>
  <text x="400" y="418" class="ct">Add flow control</text>
  <text x="400" y="444" class="cd">A concurrency cap and a</text>
  <text x="400" y="462" class="cd">throttle.</text>
  <line x1="400" y1="484" x2="626" y2="484" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="400" y="512" class="cs">you see: a burst queues under the cap</text>

  <!-- D5 Gate (keystone) -->
  <g filter="url(#sh)"><rect x="666" y="340" width="266" height="206" rx="12" fill="#faf5ff" stroke="#d8b4fe"/></g>
  <rect x="666" y="340" width="6" height="206" rx="3" fill="#9333ea"/>
  <rect x="684" y="360" width="104" height="24" rx="12" fill="#ede9fe"/><text x="698" y="376" class="tag" fill="#6d28d9">D5 &#183; GATE</text>
  <text x="900" y="376" text-anchor="end" class="tag" fill="#9333ea">KEYSTONE</text>
  <text x="686" y="418" class="ct">Durable approval gate</text>
  <text x="686" y="444" class="cd">The mind re-enters the</text>
  <text x="686" y="462" class="cd">loop on refunds.</text>
  <line x1="686" y1="484" x2="912" y2="484" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="686" y="512" class="cs">you see: suspend, approve, resume</text>

  <!-- D6 Proof -->
  <g filter="url(#sh)"><rect x="952" y="340" width="248" height="206" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="952" y="340" width="6" height="206" rx="3" fill="#64748b"/>
  <rect x="970" y="360" width="108" height="24" rx="12" fill="#f1f5f9"/><text x="984" y="376" class="tag" fill="#475569">D6 &#183; PROOF</text>
  <text x="972" y="418" class="ct">Break a step, recover</text>
  <text x="972" y="444" class="cd">The retry holds; recover</text>
  <text x="972" y="462" class="cd">on a fresh run.</text>
  <line x1="972" y1="484" x2="1180" y2="484" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="972" y="512" class="cs">you see: one ingress row per run</text>

  <!-- flow arrows -->
  <line x1="648" y1="221" x2="664" y2="221" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="934" y1="221" x2="950" y2="221" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="648" y1="443" x2="664" y2="443" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="934" y1="443" x2="950" y2="443" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1076,324 C1076,334 513,334 513,338" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="790" y="332" text-anchor="middle" class="cs">then</text>

  <!-- footer -->
  <g filter="url(#sh)"><rect x="40" y="582" width="1160" height="116" rx="12" fill="#f8fafc" stroke="#e2e8f0"/></g>
  <text x="62" y="614" class="foott">The architectural invariant of Part 4</text>
  <text x="62" y="642" class="foot">The agent never changes after D0. Every layer is the nervous system, added from the outside, one prompt at a time.</text>
  <text x="62" y="668" class="foot">Senses wake it (D2, D3), reflexes keep it correct (D1, D6), balance keeps it healthy (D4), and the gate lets a human decide (D5).</text>
</svg>
