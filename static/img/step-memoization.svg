<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .att { font-size: 14px; font-weight: 700; fill: #334155; letter-spacing: .3px; }
      .sname { font-size: 12px; fill: #0f172a; font-family: "Courier New", monospace; font-weight: 700; }
      .stat { font-size: 11.5px; font-weight: 700; }
      .badge { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .cost { font-size: 12.5px; fill: #475569; }
      .memo { font-size: 13px; fill: #334155; }
      .memok { font-size: 12px; fill: #6d28d9; font-family: "Courier New", monospace; }
      .pt { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .pb { font-size: 13px; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="1240" height="700" fill="#ffffff"/>

  <text x="620" y="44" text-anchor="middle" class="title" fill="url(#tg)">Step memoization: completed steps don't run twice</text>
  <text x="620" y="72" text-anchor="middle" class="subtitle">On a retry, finished steps return their stored result. Only the step that failed runs again.</text>

  <!-- ATTEMPT 1 -->
  <text x="48" y="112" class="att">ATTEMPT 1: first run, crashes at step 4</text>

  <g filter="url(#sh)"><rect x="48" y="126" width="200" height="92" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="48" y="126" width="6" height="92" rx="3" fill="#16a34a"/>
  <circle cx="78" cy="156" r="13" fill="#16a34a"/><text x="78" y="161" text-anchor="middle" class="badge">1</text>
  <text x="98" y="160" class="sname">load-customer</text>
  <text x="68" y="192" class="stat" fill="#15803d">stored &#183; $0.01</text>

  <g filter="url(#sh)"><rect x="284" y="126" width="200" height="92" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="284" y="126" width="6" height="92" rx="3" fill="#16a34a"/>
  <circle cx="314" cy="156" r="13" fill="#16a34a"/><text x="314" y="161" text-anchor="middle" class="badge">2</text>
  <text x="334" y="160" class="sname">load-thread</text>
  <text x="304" y="192" class="stat" fill="#15803d">stored &#183; $0.01</text>

  <g filter="url(#sh)"><rect x="520" y="126" width="200" height="92" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="520" y="126" width="6" height="92" rx="3" fill="#16a34a"/>
  <circle cx="550" cy="156" r="13" fill="#16a34a"/><text x="550" y="161" text-anchor="middle" class="badge">3</text>
  <text x="570" y="160" class="sname">run-agent</text>
  <text x="540" y="192" class="stat" fill="#15803d">stored &#183; $0.20</text>

  <g filter="url(#sh)"><rect x="756" y="126" width="200" height="92" rx="10" fill="#fff1f2" stroke="#fda4af"/></g>
  <rect x="756" y="126" width="6" height="92" rx="3" fill="#e11d48"/>
  <circle cx="786" cy="156" r="13" fill="#e11d48"/><text x="786" y="161" text-anchor="middle" class="badge">4</text>
  <text x="806" y="160" class="sname">save-draft</text>
  <text x="776" y="192" class="stat" fill="#be123c">CRASH here</text>

  <g filter="url(#sh)"><rect x="992" y="126" width="200" height="92" rx="10" fill="#f8fafc" stroke="#e2e8f0"/></g>
  <rect x="992" y="126" width="6" height="92" rx="3" fill="#cbd5e1"/>
  <circle cx="1022" cy="156" r="13" fill="#cbd5e1"/><text x="1022" y="161" text-anchor="middle" class="badge">5</text>
  <text x="1042" y="160" class="sname" fill="#94a3b8">notify</text>
  <text x="1012" y="192" class="stat" fill="#94a3b8">never reached</text>

  <line x1="252" y1="172" x2="280" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="488" y1="172" x2="516" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="724" y1="172" x2="752" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="960" y1="172" x2="988" y2="172" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>

  <text x="48" y="246" class="cost">Paid once for steps 1 to 3, then the function crashed at step 4.</text>

  <!-- ATTEMPT 2 -->
  <text x="48" y="296" class="att">ATTEMPT 2: the retry re-runs the function from the top</text>

  <g filter="url(#sh)"><rect x="48" y="310" width="200" height="92" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/></g>
  <rect x="48" y="310" width="6" height="92" rx="3" fill="#6d28d9"/>
  <circle cx="78" cy="340" r="13" fill="#6d28d9"/><text x="78" y="345" text-anchor="middle" class="badge">1</text>
  <text x="98" y="344" class="sname">load-customer</text>
  <text x="68" y="376" class="stat" fill="#6d28d9">from memo &#183; $0</text>

  <g filter="url(#sh)"><rect x="284" y="310" width="200" height="92" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/></g>
  <rect x="284" y="310" width="6" height="92" rx="3" fill="#6d28d9"/>
  <circle cx="314" cy="340" r="13" fill="#6d28d9"/><text x="314" y="345" text-anchor="middle" class="badge">2</text>
  <text x="334" y="344" class="sname">load-thread</text>
  <text x="304" y="376" class="stat" fill="#6d28d9">from memo &#183; $0</text>

  <g filter="url(#sh)"><rect x="520" y="310" width="200" height="92" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/></g>
  <rect x="520" y="310" width="6" height="92" rx="3" fill="#6d28d9"/>
  <circle cx="550" cy="340" r="13" fill="#6d28d9"/><text x="550" y="345" text-anchor="middle" class="badge">3</text>
  <text x="570" y="344" class="sname">run-agent</text>
  <text x="540" y="376" class="stat" fill="#6d28d9">from memo &#183; $0</text>

  <g filter="url(#sh)"><rect x="756" y="310" width="200" height="92" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="756" y="310" width="6" height="92" rx="3" fill="#16a34a"/>
  <circle cx="786" cy="340" r="13" fill="#16a34a"/><text x="786" y="345" text-anchor="middle" class="badge">4</text>
  <text x="806" y="344" class="sname">save-draft</text>
  <text x="776" y="376" class="stat" fill="#15803d">runs now</text>

  <g filter="url(#sh)"><rect x="992" y="310" width="200" height="92" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="992" y="310" width="6" height="92" rx="3" fill="#16a34a"/>
  <circle cx="1022" cy="340" r="13" fill="#16a34a"/><text x="1022" y="345" text-anchor="middle" class="badge">5</text>
  <text x="1042" y="344" class="sname">notify</text>
  <text x="1012" y="376" class="stat" fill="#15803d">runs, done</text>

  <line x1="252" y1="356" x2="280" y2="356" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="488" y1="356" x2="516" y2="356" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="724" y1="356" x2="752" y2="356" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="960" y1="356" x2="988" y2="356" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <text x="48" y="430" class="cost">Only steps 4 and 5 do real work. The $0.20 agent step returns from memo, so you do not pay for it twice.</text>

  <!-- MEMO STORE -->
  <g filter="url(#sh)"><rect x="48" y="450" width="1144" height="64" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/></g>
  <text x="70" y="478" class="memo">Memo store, keyed by (run_id, step_name):</text>
  <text x="70" y="500" class="memok">load-customer &#183; load-thread &#183; run-agent &#8594; stored on attempt 1, returned on attempt 2</text>

  <!-- PROPERTIES -->
  <g filter="url(#sh)"><rect x="48" y="534" width="1144" height="138" rx="10" fill="#f8fafc" stroke="#e2e8f0"/></g>
  <text x="70" y="562" class="pt">Three things this buys you</text>
  <text x="70" y="592" class="pb">1.  Retries are cheap. The expensive work is already stored, so a retry pays only for what is left.</text>
  <text x="70" y="620" class="pb">2.  Side effects happen once. A charge or an email is not repeated when the function retries.</text>
  <text x="70" y="648" class="pb">3.  Step names are the memo keys. Keep each name unique within a function, or two steps share one slot.</text>
</svg>
